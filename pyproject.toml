[project]
name = "evalora"
version = "0.1.0"
description = "Generate RAG test suites, evaluate retrieval and faithfulness, and gate CI on quality regressions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pypdf>=4.2",
    "pyyaml>=6.0.1",
    "rich>=13.7",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.scripts]
evalora = "evalora.cli:app"

[dependency-groups]
dev = [
    "fastapi>=0.162.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20261103",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalora"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: tests that call a real LLM API"]
addopts = "-m 'not live'"
